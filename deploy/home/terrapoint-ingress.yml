name: terrapoint-ingress

services:
  socat:
    image: alpine/socat@sha256:4e625a62c9ea40ccbce93b9a4fcc6b41740a9f308389c216f34c88ce3abb275b
    container_name: terrapoint-ingress-socat
    network_mode: host
    restart: unless-stopped
    init: true
    user: "65534:65534"
    read_only: true
    mem_limit: 128m
    pids_limit: 96
    cpus: 0.5
    stop_grace_period: 35s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -T
        - "3"
        - -O
        - /dev/null
        - http://172.20.0.1:8001/api/health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    command:
      - -T
      - "30"
      - TCP-LISTEN:8001,bind=172.20.0.1,fork,reuseaddr,max-children=64
      - TCP:127.0.0.1:8099,connect-timeout=5
