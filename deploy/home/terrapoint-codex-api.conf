[Unit]
Wants=terrapoint-codex-gateway.service
After=terrapoint-codex-gateway.service

[Service]
LoadCredential=codex-gateway.token:/home/arle/.omp/auth-gateway.token
LoadCredential=chat-snapshot.key:/etc/terrapoint/chat-snapshot.key
Environment=TERRAPOINT_CODEX_GATEWAY_URL=http://172.20.0.1:4000/v1/responses
Environment=TERRAPOINT_CODEX_GATEWAY_TOKEN_FILE=%d/codex-gateway.token
Environment=TERRAPOINT_CHAT_SNAPSHOT_KEY_FILE=%d/chat-snapshot.key
Environment=TERRAPOINT_CODEX_MODEL=openai-codex/gpt-6-luna
Environment=TERRAPOINT_CODEX_REASONING_EFFORT=high
UnsetEnvironment=OPENCODE_ZEN_API_KEY OPENCODE_ZEN_MODEL OPENCODE_ZEN_MAX_TOKENS
