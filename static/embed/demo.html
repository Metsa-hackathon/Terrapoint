<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Terrapointi iframe’i integratsiooninäide</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/embed/demo.css?v=1">
  <script defer src="/static/embed/loader.js?v=2"></script>
</head>
<body>
  <main>
    <p class="kicker">Keskkonnaportaali makett</p>
    <h1>Mets</h1>
    <p class="intro">Allpool on isoleeritud Terrapointi metsaandmete tõlgendaja samas laiuses, mida saab kasutada portaali sisualal.</p>
    <iframe
      data-terrapoint-forest
      src="/embed/forest"
      title="Terrapointi metsaandmete tõlgendaja"
      loading="eager"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-forms allow-same-origin"
    ></iframe>
  </main>
</body>
</html>
