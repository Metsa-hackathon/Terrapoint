<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Cross-section of a tree trunk with data rings -->
  <circle cx="32" cy="32" r="28" fill="#e8f5e9" stroke="#2d5016" stroke-width="2"/>
  <!-- Tree trunk cross-section -->
  <circle cx="32" cy="32" r="20" fill="#8B6914" stroke="#5c4033" stroke-width="1.5"/>
  <!-- Growth rings (data layers) -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#a0845c" stroke-width="1" opacity="0.8"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#a0845c" stroke-width="1" opacity="0.7"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#a0845c" stroke-width="1" opacity="0.6"/>
  <circle cx="32" cy="32" r="4" fill="#b8956a" stroke="#a0845c" stroke-width="1"/>
  <!-- Data points on rings -->
  <circle cx="32" cy="16" r="2.5" fill="#4a7c28" stroke="#2d5016" stroke-width="1"/>
  <circle cx="48" cy="32" r="2.5" fill="#4a7c28" stroke="#2d5016" stroke-width="1"/>
  <circle cx="32" cy="48" r="2.5" fill="#4a7c28" stroke="#2d5016" stroke-width="1"/>
  <circle cx="16" cy="32" r="2.5" fill="#4a7c28" stroke="#2d5016" stroke-width="1"/>
  <!-- Small connecting lines between data points -->
  <line x1="32" y1="16" x2="48" y2="32" stroke="#4a7c28" stroke-width="0.8" opacity="0.5"/>
  <line x1="48" y1="32" x2="32" y2="48" stroke="#4a7c28" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="48" x2="16" y2="32" stroke="#4a7c28" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="32" x2="32" y2="16" stroke="#4a7c28" stroke-width="0.8" opacity="0.5"/>
</svg>
