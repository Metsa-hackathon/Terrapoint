<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Leaf with grid lines - representing forest data mapping -->
  <circle cx="32" cy="32" r="28" fill="#e8f5e9" stroke="#2d5016" stroke-width="2"/>
  <!-- Leaf shape -->
  <path d="M32 10 C20 18, 12 30, 16 46 C18 52, 24 56, 32 56 C40 56, 46 52, 48 46 C52 30, 44 18, 32 10Z" fill="#4a7c28" stroke="#2d5016" stroke-width="1.5"/>
  <!-- Leaf veins (data grid) -->
  <line x1="32" y1="14" x2="32" y2="52" stroke="#e8f5e9" stroke-width="1.5" opacity="0.8"/>
  <line x1="22" y1="28" x2="32" y2="22" stroke="#e8f5e9" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="28" x2="32" y2="22" stroke="#e8f5e9" stroke-width="1" opacity="0.6"/>
  <line x1="20" y1="38" x2="32" y2="32" stroke="#e8f5e9" stroke-width="1" opacity="0.6"/>
  <line x1="44" y1="38" x2="32" y2="32" stroke="#e8f5e9" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="48" x2="32" y2="42" stroke="#e8f5e9" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="48" x2="32" y2="42" stroke="#e8f5e9" stroke-width="1" opacity="0.6"/>
  <!-- Small data nodes on veins -->
  <circle cx="27" cy="25" r="2" fill="#e8f5e9"/>
  <circle cx="37" cy="25" r="2" fill="#e8f5e9"/>
  <circle cx="24" cy="35" r="2" fill="#e8f5e9"/>
  <circle cx="40" cy="35" r="2" fill="#e8f5e9"/>
  <circle cx="26" cy="45" r="2" fill="#e8f5e9"/>
  <circle cx="38" cy="45" r="2" fill="#e8f5e9"/>
</svg>
